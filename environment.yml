name: carla_blackwell
channels:
  - defaults
dependencies:
  - python=3.10.19
  - pip=26.0.1
  - setuptools=80.10.2
  - wheel=0.46.3
  - pip:
      # CARLA Python API — install manually from your CARLA distribution:
      # pip install <CARLA_ROOT>/PythonAPI/carla/dist/carla-0.9.15-cp310-cp310-win_amd64.whl
      - carla==0.9.15

      # RL & Training
      - gymnasium==1.2.3
      - stable-baselines3==2.7.1
      - torch==2.10.0+cu128
      - torchvision==0.25.0+cu128
      - tensorboard==2.20.0
      - tensorboard-data-server==0.7.2

      # Simulation & Visualisation
      - pygame==2.6.1
      - opencv-python==4.13.0.92
      - pillow==12.0.0

      # Utilities
      - numpy==2.2.6
      - matplotlib==3.10.8
      - pandas==2.3.3
      - tqdm
      - rich

      # Supporting libraries (auto-resolved, pinned for reproducibility)
      - absl-py==2.4.0
      - cloudpickle==3.1.2
      - filelock==3.20.0
      - fsspec==2025.12.0
      - grpcio==1.78.0
      - jinja2==3.1.6
      - markdown==3.10.2
      - markupsafe==2.1.5
      - mpmath==1.3.0
      - networkx==3.4.2
      - protobuf==6.33.5
      - sympy==1.14.0
      - typing-extensions==4.15.0
      - werkzeug==3.1.5
